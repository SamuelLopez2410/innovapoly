<style>
/* Tablero en escalera: 19 columnas x 13 filas. El panel de turno ocupa el hueco superior izquierdo y la leyenda el inferior derecho. */
:root{
  --bg:#e9e7e1; --surface:#fbfaf7; --tile:#ffffff; --ink:#1b2422; --muted:#5b6561; --line:#cdd1ca; --accent:#1f6b4a; --accent-ink:#ffffff;
  --c-cr:#2e8b57; --c-pr:#e3b505; --c-tr:#ea7a2f; --c-do:#2f6fdc; --c-q:#7a8480; --c-sk:#cf3a2f; --on-pr:#1b2422;
  --shadow:0 1px 0 rgba(0,0,0,.06),0 8px 24px rgba(20,30,26,.10);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141819; --surface:#1d2325; --tile:#262d2f; --ink:#eceeeb; --muted:#9ba5a1; --line:#364042; --accent:#4cb887; --accent-ink:#0d1a14;
  --c-cr:#3aa468; --c-pr:#e8bd1c; --c-tr:#f08a40; --c-do:#5a92f0; --c-q:#a2aca8; --c-sk:#ec5a4f; --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding:12px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.wrap{max-width:1280px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{border-color:var(--c-sk);color:var(--c-sk)}
.btn.good{border-color:var(--c-cr);color:var(--c-cr)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.opt{text-align:left;width:100%;display:block}
.btn small{display:block;font-weight:400;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.panel h2{font-size:22px;margin-bottom:12px}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.field{display:grid;gap:4px;margin-bottom:14px}
.field label,.lbl2{font-weight:700;font-size:14px}
input[type=text],select{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px;width:100%}
.toksel{display:flex;gap:6px;flex-wrap:wrap}
.toksel button{width:46px;height:46px;font-size:24px;border:2px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.toksel button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--bg))}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);margin:14px 0}
.sep::before,.sep::after{content:"";flex:1;border-top:1px solid var(--line)}
.code{font-family:var(--f-display);font-weight:800;font-size:56px;letter-spacing:.12em;color:var(--accent)}
.roster{display:grid;gap:8px;margin:12px 0}
.rost{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.rost .e{font-size:26px}
.note{font-size:14px;color:var(--muted)}
.err{color:var(--c-sk);font-weight:700}
.hero-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.hero-list li{display:flex;gap:10px;align-items:flex-start}
.dot{flex:none;width:14px;height:14px;border-radius:50%;margin-top:5px;display:inline-block}
.d-cr{background:var(--c-cr)}.d-pr{background:var(--c-pr)}.d-tr{background:var(--c-tr)}.d-do{background:var(--c-do)}.d-q{background:var(--c-q)}.d-sk{background:var(--c-sk)}
.teamrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 64px;gap:8px;margin-bottom:8px}
/* juego: tablero en anillo de 32 casillas sobre la imagen; el panel del turno va en el hueco inferior del centro */
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.gmain{min-width:0}
.boardscroll{overflow-x:auto;border-radius:12px}
.boardin{container-type:inline-size;min-width:640px;width:100%;max-width:min(100%,calc(100vh - 90px));margin:0 auto}

.center .meta{color:var(--muted);font-size:1.25cqw}
.center .who{font-family:var(--f-display);font-weight:800;font-size:2.2cqw;line-height:1.05;overflow-wrap:anywhere}
.die{width:6.2cqw;height:6.2cqw;border-radius:1.2cqw;border:3px solid var(--ink);background:var(--tile);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:3.4cqw;flex:none}
.die.rolling{animation:shake .12s infinite}
@keyframes shake{50%{transform:rotate(8deg)}}
.center .btn.primary{font-size:1.6cqw;padding:.8cqw 2cqw;min-height:0;flex:none}
.legendbox{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.legendbox span{display:flex;gap:6px;align-items:center}.legendbox .dot{width:11px;height:11px;margin:0}
/* billetes */
.billrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bill{display:inline-flex;align-items:center;gap:8px;border-radius:6px;padding:4px 9px;color:#fff;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;border:2px solid rgba(255,255,255,.4);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.b10{background:#b5473d}.b20{background:#a85d14}.b50{background:#6f54a3}.b100{background:#2a857a}
.paybox{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.brow .bill{font-size:16px;padding:9px 12px;justify-content:space-between;width:100%}
.brow .bill span:last-child{font-size:12px;font-weight:600;opacity:.9}
.step{display:flex;align-items:center;gap:8px}
.step button{width:42px;height:42px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
.step button:hover{border-color:var(--ink)}
.step b{min-width:22px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.paysum{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums;padding:6px 2px}
.mini{display:flex;gap:4px;flex-wrap:wrap}.mini .bill{font-size:11px;padding:1px 6px;gap:4px;border-width:1px}
.debt{color:var(--c-sk);font-weight:700;font-size:13px}
/* mazos sobre el tablero */
.deck{position:absolute;width:5.2cqw;height:7.2cqw;transform:translate(-50%,-50%) rotate(var(--r,0deg));pointer-events:none}
.deck .dk{position:absolute;inset:0;border-radius:.6cqw;background:#1d2a4d;border:.22cqw solid #c9a45c;border-top:.9cqw solid var(--cc);box-shadow:0 .2cqw .5cqw rgba(0,0,0,.35);display:grid;place-items:center}
.deck .dk:nth-child(1){transform:translate(.55cqw,.55cqw)}
.deck .dk:nth-child(2){transform:translate(.28cqw,.28cqw)}
.deck .dk b{font-family:var(--f-display);font-size:2cqw;color:#f3e6c4;margin-top:.3cqw}
.deck small{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:1cqw;font-size:1cqw;white-space:nowrap;color:#3b3220;font-weight:700;background:rgba(255,250,238,.85);padding:0 .5cqw;border-radius:.3cqw}
.deck.t-CR{--cc:var(--c-cr)}.deck.t-PR{--cc:var(--c-pr)}.deck.t-TR{--cc:var(--c-tr)}.deck.t-DO{--cc:var(--c-do)}.deck.t-Q{--cc:var(--c-q)}.deck.t-SK{--cc:var(--c-sk)}
/* carta 3D */
.modal{perspective:1600px}
.card3d{position:relative;width:min(560px,100%);transform-style:preserve-3d}
.card3d .face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card3d .front{transform:rotateY(180deg)}
.card3d .back{position:absolute;inset:0;border-radius:14px;background:#1d2a4d;border:8px solid #c9a45c;border-top:22px solid var(--kc,#c9a45c);display:grid;place-items:center;color:#f3e6c4;text-align:center;box-shadow:var(--shadow)}
.card3d .back b{display:block;font-family:var(--f-display);font-size:clamp(18px,4.5vw,30px);letter-spacing:.06em}
.card3d .back i{display:block;font-style:normal;font-family:var(--f-display);font-weight:800;font-size:clamp(48px,12vw,84px);color:var(--kc);line-height:1.1}
.card3d:not(.done){pointer-events:none}
.card3d.done .back{display:none}
.card3d.done .front{transform:none}
.card3d .sheet{width:100%;max-height:calc(100vh - 40px)}
.side{display:grid;gap:12px;min-width:0}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px}
.pcard.turn{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.pcard header{display:flex;align-items:center;gap:8px}
.pcard .e{font-size:24px}
.pcard .nm{font-family:var(--f-display);font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.pcard .pts{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.pcard .pts small{font-size:12px;font-weight:600;color:var(--muted)}
.money{font-variant-numeric:tabular-nums;font-weight:700}.money.neg{color:var(--c-sk)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--bg)}
.chip.prot{border-color:var(--c-cr);color:var(--c-cr);font-weight:600}
.chip.sold{border-color:var(--c-tr);color:var(--c-tr);font-weight:600}
.chip.off{border-color:var(--c-sk);color:var(--c-sk)}
.counts{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.counts span{display:inline-flex;gap:4px;align-items:center}
.counts .dot{width:9px;height:9px;margin:0}
.logbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:200px;overflow:auto;font-size:14px}
.logbox h3{font-size:15px;margin-bottom:6px}
.logbox p{margin:0 0 4px;color:var(--muted)}.logbox p:first-of-type{color:var(--ink)}
.banner{background:color-mix(in srgb,var(--c-sk) 14%,var(--surface));border:1px solid var(--c-sk);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.mine{color:var(--accent);font-weight:700}
/* ventanas */
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,14,12,.55);z-index:50;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.modal.on{display:grid}
#dlg{z-index:60}
.sheet{background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:calc(100% - 8px);overflow:auto;border-radius:14px;border-top:10px solid var(--kc,var(--accent));padding:20px;box-shadow:var(--shadow);display:grid;gap:12px}
.k-cr{--kc:var(--c-cr)}.k-pr{--kc:var(--c-pr)}.k-tr{--kc:var(--c-tr)}.k-do{--kc:var(--c-do)}.k-q{--kc:var(--c-q)}.k-sk{--kc:var(--c-sk)}
.sheet .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sheet h2{font-size:22px}
.sheet .body{display:grid;gap:8px}.sheet .body p{margin:0}
.sheet .btns{display:grid;gap:8px}
.wait{font-weight:700;color:var(--accent)}
.good-t{color:var(--c-cr);font-weight:700}.bad-t{color:var(--c-sk);font-weight:700}
.timer{font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.rules h3{font-size:16px;margin-top:6px}.rules ul{margin:4px 0;padding-left:20px}
.final table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.final th,.final td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
.final th:first-child,.final td:first-child{text-align:left}
.final th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.final td.tot{font-family:var(--f-display);font-weight:800;font-size:20px}
.scroll{overflow-x:auto}
.winner{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,40px);margin-bottom:8px}
.ctl{display:none;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ctl .die{width:56px;height:56px;font-size:30px;border-radius:12px;flex:none}
.ctl .who{font-family:var(--f-display);font-weight:800;font-size:20px;overflow-wrap:anywhere}
.ctl .meta{color:var(--muted);font-size:13px}.ctl .mid{flex:1;min-width:0}.ctl .msg{font-size:13px;color:var(--muted)}
@media (max-width:900px){.two,.game{grid-template-columns:minmax(0,1fr)}.ctl{display:flex}.center{display:none}}
@media (prefers-reduced-motion:reduce){.die.rolling{animation:none}}

.creditbar{margin:0 0 16px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;font-size:15px;line-height:1.45;color:var(--ink)}
#bgm{position:fixed;left:0;bottom:12px;z-index:40;display:flex;align-items:flex-end;transform:translateX(calc(-100% + 46px));transition:transform .25s ease}
#bgm.open{transform:none}
@media (prefers-reduced-motion:reduce){#bgm{transition:none}}
#bgm .bgm-panel{width:216px;background:var(--surface);border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0;box-shadow:var(--shadow);padding:8px;color:var(--ink);font:600 13px var(--f-body)}
#bgm .bgm-panel h3{margin:0 0 6px;font:700 14px var(--f-display)}
#bgm .bgm-frame{width:200px;height:200px;background:#000;border-radius:8px;overflow:hidden}
#bgm .bgm-frame iframe{width:200px;height:200px;display:block}
#bgm .bgm-row{display:flex;gap:6px;align-items:center;margin-top:8px}
#bgm .bgm-row button{min-width:40px;min-height:40px;border:1px solid var(--line);background:var(--tile);color:var(--ink);border-radius:8px;font-size:17px;cursor:pointer}
#bgm .bgm-row input[type=range]{flex:1;min-width:0;min-height:40px}
#bgm .bgm-note{margin:6px 0 0;font:400 12px var(--f-body);color:var(--muted)}
#bgm .bgm-note a{color:var(--accent)}
#bgm .bgm-tab{width:46px;height:46px;margin-bottom:0;border:1px solid var(--line);border-left:0;background:var(--accent);color:var(--accent-ink);border-radius:0 12px 12px 0;font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
#bgm .bgm-tab:focus-visible,#bgm .bgm-row button:focus-visible{outline:3px solid var(--c-do);outline-offset:2px}
</style>

   En la página publicada no hay acceso a servidores externos, así que los equipos se comunican por la sala en vivo del artefacto.
   Canal 'up': cliente → anfitrión. Canal 'down': anfitrión → todos (el estado se comprime y se parte en trozos de <4 KiB). */

async function pack(str){ const cs = new CompressionStream('gzip'), w = cs.writable.getWriter(); w.write(new TextEncoder().encode(str)); w.close(); const u = new Uint8Array(await new Response(cs.readable).arrayBuffer()); let b=''; for(let i=0;i<u.length;i+=8192) b += String.fromCharCode.apply(null, u.subarray(i,i+8192)); return btoa(b); }
async function unpack(b64){ const b = atob(b64), u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); const ds = new DecompressionStream('gzip'), w = ds.writable.getWriter(); w.write(u); w.close(); return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()); }
function broadcastRT(){ if(bcT) return; bcT = setTimeout(async()=>{ bcT=null; if(!R) return; try{ await emitState(); }catch(e){} }, 220); }
async function emitState(){
  const txt = JSON.stringify(S); let z = 1, d; try{ d = await pack(txt); }catch(e){ z = 0; d = txt; }
  const size = z ? 3000 : 900, n = Math.ceil(d.length/size), id = bcId = Math.max(bcId+1, Date.now());
  for(let i=0;i<n && R;i++) await R.emit('down', {k:'st', id, i, n, z, d:d.slice(i*size,(i+1)*size)});
}

function rconn(uid){ return rcs[uid] || (rcs[uid] = {uid, open:true, close(){}, send(raw){ try{ const o = JSON.parse(raw); if(o.t==='err' && R) R.emit('down',{k:'err', to:uid, msg:o.msg}).catch(()=>{}); }catch(e){} }}); }

async function startHostRT(creating){
  const myGen = connGen;
  for(let t=0;t<4;t++){
    try{ R = await RM.join('innova-'+roomCode.toLowerCase()); await R.presence({uid:MY_UID, host:true}); }
    catch(e){ netMsg='No se pudo crear la sala ('+(e&&e.code||'error')+').'; stopNet(); role='none'; return goLanding(); }
    if(!creating) break;
    await sleep(1500);
    if(!R.peers().some(p=>!p.isMe && p.presence && p.presence.host) || t===3) break;
    try{ await R.leave(); }catch(e){} R = null; roomCode = genCode();
  }
  if(myGen!==connGen || !R) return;
  S.code = roomCode; netMsg=''; keepAwake();
  R.on('up', msg=>{ if(role!=='host' || msg.isMe || !S) return; const m = msg.data; if(!m || typeof m!=='object' || !m.uid) return; hostGot(rconn(String(m.uid).slice(0,16)), m); });
  const apply = full=>{ if(role!=='host' || !R || !S) return; const here = new Set(R.peers().map(p=>p.presence && p.presence.uid).filter(Boolean)); let ch = false;
    S.players.forEach(p=>{ if(p.uid===MY_UID) return; const on = here.has(p.uid); if(on && !p.online){ p.online=true; ch=true; } else if(!on && p.online && full){ p.online=false; ch=true; addLog(p.name+' se desconectó.'); } });
    if(ch) sync(); };
  R.onPeers(()=>{ apply(false); clearTimeout(prT); prT = setTimeout(()=>apply(true), 3500); });
  clearInterval(hbIv); hbIv = setInterval(()=>{ if(role==='host' && R && S) broadcastRT(); }, 5000);
  sync();
}

  const myGen = connGen, fail = msg=>{ if(myGen!==connGen) return; netMsg=msg; stopNet(); role='none'; ls.del('inv-room'); goLanding(); };
  try{ R = await RM.join('innova-'+code.toLowerCase()); await R.presence({uid:MY_UID}); }catch(e){ return fail('No se pudo entrar a la sala ('+(e&&e.code||'error')+').'); }
  if(myGen!==connGen) return;
  const info = myPlayerInfo(), sendJoin = ()=>{ if(R) R.emit('up', Object.assign({t:'join'}, info)).catch(()=>{}); };
  lastRx = Date.now();
  R.on('down', msg=>{
    const m = msg.data; if(role!=='client' || !m || typeof m!=='object' || msg.isMe) return;
    const hp = R.peers().find(p=>p.peer===msg.peer); if(!hp || !hp.presence || !hp.presence.host) return;
    lastRx = Date.now();
    if(m.k==='err'){ if(m.to===MY_UID) fail(m.msg); return; }
    if(m.k!=='st') return;
    const a = asm[m.id] || (asm[m.id] = {n:m.n, p:[], c:0, z:m.z});
    if(a.p[m.i]===undefined){ a.p[m.i]=m.d; a.c++; }
    if(a.c!==a.n) return;
    delete asm[m.id]; Object.keys(asm).forEach(k=>{ if(+k<m.id) delete asm[k]; });
    if(m.id<=lastId) return; lastId = m.id;
    (a.z ? unpack(a.p.join('')) : Promise.resolve(a.p.join(''))).then(txt=>{
      if(role!=='client' || m.id<lastId) return;
      S = JSON.parse(txt); lost = false; view = S.phase==='lobby'?'room':(S.phase==='over'?'final':'game'); if(S.phase==='over') ls.del('inv-room'); else ls.set('inv-room', code); render();
    }).catch(()=>{});
  });
  R.onConnection(c=>{ if(c && S) sendJoin(); });
  sendJoin(); keepAwake(); let tries = 0;
  clearInterval(hbIv); hbIv = setInterval(()=>{
    if(myGen!==connGen) return clearInterval(hbIv);
    if(!S){ if(++tries>4){ clearInterval(hbIv); return fail('No existe una sala con el código '+code+', o el anfitrión no está conectado.'); } return sendJoin(); }
    const stale = Date.now()-lastRx > 15000;
    if(stale){ sendJoin(); netMsg='Reconectando con el anfitrión…'; }
    if(stale!==lost){ lost = stale; render(); }
  }, 2500);
}
const noPeer = ()=>{ if(typeof Peer==='undefined'){ netMsg='No se pudo cargar PeerJS. Revisa tu conexión a internet.'; goLanding(); return true; } return false; };

function hostRoom(){
  if(RM) return hostRoomRT();
  if(noPeer()) return;
  readLanding(); stopNet();
  roomCode = genCode(); role='host'; S = newState(false); S.players.push(mkPlayer(0, myPlayerInfo())); H.decks = null;
  netMsg=''; view='room'; render(); openHostPeer(0, false);
}
function resumeHost(){
  if(!RM && noPeer()) return;
  let sv=null; try{ sv = JSON.parse(ls.get('inv-host')); }catch(e){}
  if(!sv || !sv.S || Date.now()-sv.t > 6*3600e3){ ls.del('inv-host'); netMsg='No hay una sala guardada para recuperar.'; return goLanding(); }
  readLanding(); stopNet();
  roomCode = sv.code; role='host'; S = sv.S; H.decks = sv.decks;
  const me = S.players.find(p=>p.uid===sv.uid); if(me) me.uid = MY_UID; S.hostUid = MY_UID;
  S.players.forEach(p=>{ p.online = p.uid===MY_UID; });
  S.prompt=null; S.busy=false; S.rolling=false; H.resolve=null; addLog('El anfitrión recuperó la sala. El turno en curso se reinicia.');
  netMsg='Recuperando sala…'; view = S.phase==='lobby' ? 'room' : 'game'; render(); if(RM) return startHostRT(false); openHostPeer(0, true);
}
function openHostPeer(tries, resuming){
  const myGen = ++connGen;
  peer = new Peer('innova-uq-'+roomCode, PEER_CFG);
  peer.on('open', ()=>{ if(myGen!==connGen) return; netMsg=''; S.code = roomCode; keepAwake(); sync();
    clearInterval(hbIv); hbIv = setInterval(()=>{ Object.values(conns).forEach(c=>send(c,{t:'hb'})); }, 6000); });
  peer.on('disconnected', ()=>{ if(myGen===connGen){ try{ peer.reconnect(); }catch(e){} } });
  peer.on('error', e=>{
    if(myGen!==connGen) return;
    if(e && e.type==='unavailable-id'){
      try{ peer.destroy(); }catch(_){}
      if(resuming && tries<10){ netMsg='Recuperando sala… (intento '+(tries+1)+')'; render(); return void setTimeout(()=>{ if(role==='host') openHostPeer(tries+1, true); }, 3000); }
      if(!resuming && tries<5){ roomCode = genCode(); S.code = roomCode; return openHostPeer(tries+1, false); }
    }
    if(e && (e.type==='network' || e.type==='server-error' || e.type==='socket-error' || e.type==='socket-closed')) return;
    netMsg='No se pudo crear la sala ('+(e&&e.type||'error')+'). Revisa tu conexión.'; role='none'; stopNet(); goLanding();
  });
  peer.on('connection', c=>{
    c.on('data', raw => { let m; try{ m = typeof raw==='string'?JSON.parse(raw):raw; }catch(e){ return; } hostGot(c, m); });
    c.on('close', ()=>{ const p = S.players.find(x=>x.uid===c.uid); if(p && conns[c.uid]===c){ p.online=false; delete conns[c.uid]; addLog(p.name+' se desconectó.'); sync(); } });
  });
}
function hostGot(c, m){
  if(m.t==='ping'){ send(c,{t:'hb'}); return; }
  if(m.t==='join'){
    const uid = String(m.uid||'').slice(0,16), name = String(m.name||'Jugador').slice(0,24)||'Jugador';
    if(!uid) return;
    c.uid = uid; let ex = S.players.find(p=>p.uid===uid);
    /* reingreso desde otro dispositivo/pestaña: se reconoce por el nombre del equipo si estaba desconectado */
    if(!ex && S.phase!=='lobby'){ const nm = name.toLowerCase(); ex = S.players.find(p=>!p.online && p.uid!==S.hostUid && p.name.toLowerCase()===nm); if(ex){ if(conns[ex.uid]) delete conns[ex.uid]; ex.uid = uid; } }
    if(ex){ const old = conns[uid]; conns[uid]=c; if(old && old!==c){ try{ old.close(); }catch(e){} conns[uid]=c; } c.uid = uid; if(!ex.online) addLog(ex.name+' volvió a la partida.'); ex.online = true; }
    else if(S.phase==='lobby' && S.players.length<MAXP){ let f = String(m.ficha||'⭐').slice(0,4); if(S.players.some(p=>p.ficha===f)){ f = EMOJIS.find(e=>!S.players.some(p=>p.ficha===e)) || f; } S.players.push(mkPlayer(S.players.length, {uid, name, ficha:f, custom:!!m.custom})); conns[uid]=c; addLog(name+' se unió.'); }
    else { send(c,{t:'err', msg: S.phase==='lobby'?'La sala está llena.':'La partida ya empezó. Para volver entra con el mismo nombre de equipo.'}); return; }
    sync();
  }
  if(!S.players.some(p=>p.uid===c.uid)) return;
  if(m.t==='roll') hostRoll(c.uid);
  if(m.t==='resp') hostResp(c.uid, m);
}
function joinRoom(code){
  if(RM) return joinRoomRT(code);
  if(noPeer()) return;
  readLanding(); stopNet(); role='client'; S=null; roomCode=code; netMsg='Conectando…'; view='room'; renderRoomWait();
  clientConnect(code);
}
function clientConnect(code){
  clearTimeout(retryTo); clearInterval(hbIv);
  try{ conn&&conn.close(); }catch(e){} try{ peer&&peer.destroy(); }catch(e){}
  const myGen = ++connGen, first = !S;
  const retryLater = (why)=>{
    if(myGen!==connGen || role!=='client') return;
    if(retry>=12){ netMsg='No se pudo reconectar con la sala '+code+'.'; stopNet(); role='none'; ls.del('inv-room'); return goLanding(); }
    retry++; lost = true; netMsg='Reconectando… (intento '+retry+')'; render();
    retryTo = setTimeout(()=>{ if(myGen===connGen && role==='client') clientConnect(code); }, Math.min(1000*retry, 5000));
  };
  peer = new Peer(PEER_CFG);
  peer.on('error', e=>{
    if(myGen!==connGen) return;
    if(e && e.type==='peer-unavailable' && first && retry===0){ netMsg='No existe una sala con el código '+code+'.'; stopNet(); role='none'; return goLanding(); }
    retryLater();
  });
  peer.on('disconnected', ()=>{ if(myGen===connGen && peer && !peer.destroyed){ try{ peer.reconnect(); }catch(e){} } });
  peer.on('open', ()=>{
    if(myGen!==connGen) return;
    const c = conn = peer.connect('innova-uq-'+code, {reliable:true});
    const to = setTimeout(()=>{ if(myGen===connGen && !c.open) retryLater(); }, 12000);
    c.on('open', ()=>{ if(myGen!==connGen) return; clearTimeout(to); retry=0; lost=false; lastRx=Date.now(); netMsg='Conectado. Esperando…'; ls.set('inv-room', code); keepAwake(); send(c, Object.assign({t:'join'}, myPlayerInfo()));
      clearInterval(hbIv); hbIv = setInterval(()=>{ if(myGen!==connGen) return clearInterval(hbIv); send(c,{t:'ping'}); if(Date.now()-lastRx>20000){ clearInterval(hbIv); retryLater(); } }, 5000); });
    c.on('data', raw=>{ if(myGen!==connGen) return; lastRx = Date.now(); let m; try{ m = typeof raw==='string'?JSON.parse(raw):raw; }catch(e){ return; }
      if(m.t==='state'){ S = m.s; view = S.phase==='lobby'?'room':(S.phase==='over'?'final':'game'); if(S.phase==='over') ls.del('inv-room'); render(); }
      if(m.t==='err'){ netMsg=m.msg; stopNet(); role='none'; ls.del('inv-room'); goLanding(); } });
    c.on('close', ()=>{ clearTimeout(to); if(myGen===connGen && role==='client') retryLater(); });
  });
}

/* ---------- Motor (solo anfitrión) ---------- */
function addLog(t){ if(!S) return; S.log.unshift(t); S.log = S.log.slice(0,40); }
/* recibir: primero se abona la deuda; el resto llega en billetes */
function receive(p,n){ let rest=n; if(p.debt>0){ const x=Math.min(p.debt,rest); p.debt-=x; rest-=x; } const b=billsFor(rest); addBills(p.wallet,b); return b; }
/* pagar: el jugador elige los billetes; el banco devuelve el cambio */
async function charge(p,n,why,kind='pr'){
  const total = walletTotal(p.wallet);
  if(total < n){
    await ask({kind, tag:'Pago', title:'Fondos insuficientes', body:`<p>${esc(p.name)} debe pagar <b>${fmt(n)}</b> por: ${esc(why)}.</p><p>Solo tienen ${fmt(total)}. Entregan todos sus billetes y quedan con una <b>deuda de ${fmt(n-total)}</b>, que se descuenta de sus próximos ingresos.</p>`, buttons: ok('Entregar todo')});
    p.wallet = {}; p.debt = (p.debt||0) + n - total; addLog(`${p.name} pagó ${fmt(total)} y quedó debiendo ${fmt(n-total)} (${why}).`); return;
  }
  const a = await ask({kind, tag:'Pago', title:'Elijan los billetes', body:`<p>${esc(p.name)} debe pagar <b>${fmt(n)}</b>.</p><p class="note">${esc(why)}. Si pagan con de más, el banco devuelve el cambio.</p>`, pay:{amount:n, wallet:Object.assign({},p.wallet)}, buttons:[{label:'Pagar con estos billetes', value:'pay', cls:'primary'}]});
  let sum=0; DENOMS.forEach(d=>{ const k=a.sel[d]||0; p.wallet[d]=(p.wallet[d]||0)-k; sum+=k*d; });
  const chg = sum-n; if(chg>0) addBills(p.wallet, billsFor(chg));
  addLog(`${p.name} pagó ${fmt(n)} (${why})${chg>0?` · cambio ${fmt(chg)}`:''}.`);
}
function ask(spec){
  return new Promise(res=>{
    S.prompt = Object.assign({id:++H.pid, who:'active', kind:'cr', tag:'', title:'', body:'', buttons:[], field:null, timer:false, pay:null, draw:null}, spec);
    H.resolve = res; sync();
  });
}
const ok = (label='Continuar') => [{label, value:'ok', cls:'primary'}];
const note = (kind,tag,title,body,draw=null) => ask({kind,tag,title,body,buttons:ok(),draw});
function hostResp(uid, m){
  const pr = S.prompt; if(!pr || pr.id!==m.pid || !H.resolve) return;
  if(!canAct(pr, uid)) return;
  const b = pr.buttons.find(x=>String(x.value)===String(m.v)); if(!b) return;
  const t = String(m.text||'').trim().slice(0,60);
  if(pr.field && b.needText && !t) return;
  let sel = null;
  if(pr.pay){ sel = {}; let sum = 0; for(const d of DENOMS){ const k = Math.floor(+((m.sel||{})[d])||0); if(k<0 || k>(pr.pay.wallet[d]||0)) return; sel[d]=k; sum+=k*d; } if(sum<pr.pay.amount) return; }
  const r = H.resolve; H.resolve = null; S.prompt = null; sync(); r({v:b.value, t, sel});
}
function hostRoll(uid){
  if(!S || S.phase!=='play' || S.busy || S.over) return;
  if(!canRoll(uid)) return;
  playTurn();
}
function drawCard(kind){
  if(!H.decks[kind].length) H.decks[kind] = shuffle(CARDS[kind].map((_,i)=>i));
  return H.decks[kind].shift();
}
function startPlay(){
  S.players.forEach(p=>{ p.wallet = Object.assign({}, START[S.capital]||START[500000]); p.debt = 0; });
  H.decks = {cr: CARDS.cr.map((_,i)=>i), tr: shuffle(CARDS.tr.map((_,i)=>i)), do: shuffle(CARDS.do.map((_,i)=>i)), q: shuffle(CARDS.q.map((_,i)=>i)), sk: shuffle(CARDS.sk.map((_,i)=>i))};
  S.phase = 'play'; S.turn = 0; S.log = ['Comienza la partida. Las primeras 6 casillas son de creación.'];
  view = 'game'; sync();
}
async function playTurn(){
  S.busy = true; sync();
  const p = cur();
  try{
    if(p.skip>0){
      p.skip--; addLog(`${p.name} pierde este turno.`);
      await note('sk','Turno perdido',esc(p.name),`<p>Por la sanción anterior, este equipo no juega en este turno. Turnos que le quedan por perder: <b>${p.skip}</b>.</p>`);
    } else {
      const r = await rollDie(); await moveBy(p, r); if(!p.done) await resolve(p);
    }
  }catch(e){ console.error(e); }
  endTurn();
}
async function rollDie(){
  S.rolling = true; sync(); await sleep(FAST?150:800);
  const r = 1+Math.floor(Math.random()*6); S.die = r; S.rolling = false; addLog(`${cur().name} sacó ${r}.`); sync(); return r;
}
async function moveBy(p, r){
  for(let i=0;i<r;i++){ p.pos++; if(p.pos>=GOAL){ p.pos=GOAL; sync(); break; } sync(); await sleep(FAST?10:170); }
  if(p.pos>=GOAL){
    p.done = ++S.finished; const pts = RANK_PTS[p.done-1]||0; addLog(`${p.name} llegó a la meta en el puesto ${p.done}.`);
    await note('cr','Meta',`¡${esc(p.name)} llegó en el puesto ${p.done}!`,`<p>Recibe <b>${pts} puntos</b> por el orden de llegada. Ya no juega más turnos; los demás pueden seguir sumando tarjetas.</p>`);
  }
}
function endTurn(){
  if(S.players.every(p=>p.done) || S.endReq) return finishGame();
  let n = S.turn; do { n = (n+1)%S.players.length; } while(S.players[n].done);
  S.turn = n; S.busy = false; sync();
}
function finishGame(){ ls.del('inv-host'); S.over = true; S.phase = 'over'; S.busy = false; S.prompt = null; view = 'final'; sync(); }
async function resolve(p){
  const fn = {CR:cellCR, PR:cellPR, TR:cellTR, DO:cellDO, Q:cellQ, SK:cellSK}[CELLS[p.pos]];
  if(fn) await fn(p);
}

/* Creación (verde) */
async function cellCR(p){

    const a = await ask({draw: drawn?null:'CR', kind:'cr', tag:'Creación intelectual · verde = tengo algo', title:esc(p.name), body: mandatory ? '<p>Esta es una de las primeras casillas, así que <b>deben adquirir una creación</b>. Elijan cómo.</p>' : '<p>Pueden adquirir otra creación o dejar pasar la oportunidad sin costo.</p>', buttons});

      if(ty.v==='back') continue;
      await charge(p,50000,'Idear tu propia creación','cr'); p.creations.push({name:nm.t, desc:'Creación propia del equipo.', tipo:ty.v, own:true, prot:null, sold:false});
      addLog(`${p.name} ideó «${nm.t}» (-${fmt(50000)}).`);

    }
    const opts = shuffle(avail).slice(0,4);

    addLog(`${p.name} adquirió «${CR_META[i].name}» (-${fmt(100000)}).`);
    await note('cr','Creación adquirida',esc(CR_META[i].name),`<p>${esc(CARDS.cr[i])}</p><p>Pagan <b>${fmt(100000)}</b> y ganan <b>5 puntos</b>.</p>`); return;

  }
  await charge(p,30000,'Reto de transferencia no aprobado','tr'); addLog(`${p.name} no superó el reto de transferencia (-${fmt(30000)}).`);

/* Interrogante (blanco) */
async function cellQ(p){
  const i = drawCard('q'), q = CARDS.q[i], order = shuffle(q.o.map((t,k)=>k)), L = 'ABCD';
  const a = await ask({draw:'Q', kind:'q', tag:'Interrogante · blanco = respondo una pregunta', title:esc(p.name), body:`<p><b>${esc(q.q)}</b></p>`,
    buttons: order.map((k,n)=>({label:`${L[n]}) ${esc(q.o[k])}`, value:k, cls:'opt'})).concat([{label:`Pagar ${fmt(10000)} para ver la respuesta`, value:'reveal', cls:'danger opt'}])});
  const correct = q.o[q.a];
  if(a.v==='reveal'){ await charge(p,10000,'Ver la respuesta correcta','q'); addLog(`${p.name} pagó ${fmt(10000)} para ver la respuesta.`); return note('q','Respuesta revelada',esc(p.name),`<p>Pagan ${fmt(10000)}. La respuesta correcta es:</p><p class="good-t">${esc(correct)}</p><p class="note">No suman tarjeta ni puntos en este turno.</p>`); }
  if(a.v===q.a){ const bb = receive(p,50000); p.q++; addLog(`${p.name} acertó un interrogante (+${fmt(50000)}).`); return note('q','¡Correcto!',esc(p.name),`<p class="good-t">Ganan ${fmt(50000)} y la tarjeta (3 puntos).</p>${billsHtml(bb)}<p>${esc(correct)}</p>`); }
  await charge(p,20000,'Respuesta incorrecta','q'); addLog(`${p.name} falló un interrogante (-${fmt(20000)}).`);

/* Sanción (rojo) */
async function cellSK(p){

}

/* ---------- Puntaje ---------- */
function scoreAll(){
  const ps = S.players, byMoney = ps.map((p,i)=>i).sort((a,b)=>money(ps[b])-money(ps[a]));
  return ps.map((p,i)=>{
    const prot = p.creations.filter(c=>c.prot).length, sold = p.creations.filter(c=>c.sold).length;
    const b = {llegada:p.done?(RANK_PTS[p.done-1]||0):0, dinero:RANK_PTS[byMoney.indexOf(i)]||4, tarjetas:p.creations.length*5+prot*8+p.tr*10+p.do*5+p.q*3-p.sk, extras:sold*10+(p.custom?10:0)};
    b.total = b.llegada+b.dinero+b.tarjetas+b.extras; return b;
  });
}

}

      <div class="chips">${q.creations.length?q.creations.map(c=>`<span class="chip ${c.sold?'sold':c.prot?'prot':''}" title="${esc(c.desc)}">${esc(c.name)}${c.sold?' · vendida':c.prot?' · protegida':''}</span>`).join(''):'<span class="chip">Sin creación</span>'}${q.online?'':'<span class="chip off">desconectado</span>'}</div>
      <div class="counts"><span><i class="dot d-tr"></i>${q.tr}</span><span><i class="dot d-do"></i>${q.do}</span><span><i class="dot d-q"></i>${q.q}</span><span><i class="dot d-sk"></i>${q.sk}</span></div></div>`; }).join('');
  $('#log').innerHTML = `<h3>Bitácora</h3>` + S.log.slice(0,12).map(l=>`<p>${esc(l)}</p>`).join('');
  const bs = $('#bs'); if(bs && bs.scrollWidth>bs.clientWidth && hc) bs.scrollTo({left: Math.max(0, hc.offsetLeft - bs.clientWidth/2), behavior: FAST?'auto':'smooth'});
}
let timerIv = null;
let paySel = null, animId = 0;
/* la carta sale del mazo del tablero, llega al centro y se da vuelta */
function runFlip(m, key){
  const card = m.querySelector('.card3d'), deck = $('#deck-'+key); if(!card) return;
  if(!deck || !card.animate){ card.classList.add('done'); return; }
  const r = card.getBoundingClientRect(), d = deck.getBoundingClientRect();
  let dx = (d.left+d.width/2)-(r.left+r.width/2), dy = (d.top+d.height/2)-(r.top+r.height/2);
  dx = Math.max(-innerWidth/2, Math.min(innerWidth/2, dx)); dy = Math.max(-innerHeight/2, Math.min(innerHeight/2, dy));
  const s = Math.max(.08, Math.min(1, d.width/r.width));
  const fin = ()=>{ if(card.isConnected){ try{ a.cancel(); }catch(e){} card.classList.add('done'); } };
  const a = card.animate([
    {transform:`translate(${dx}px,${dy}px) scale(${s}) rotateY(0deg) rotateZ(-8deg)`, offset:0, easing:'cubic-bezier(.2,.7,.25,1)'},
    {transform:'translate(0,0) scale(1.04) rotateY(0deg) rotateZ(0deg)', offset:.5, easing:'ease-in-out'},
    {transform:'translate(0,0) scale(1) rotateY(180deg) rotateZ(0deg)', offset:1}
  ], {duration:1500, fill:'forwards'});
  a.onfinish = fin; setTimeout(fin, 1900);
}
function renderPrompt(){
  const m = $('#modal'), pr = S && S.prompt;
  if(!pr || view!=='game'){ if(m.dataset.key){ m.className='modal'; m.innerHTML=''; m.dataset.key=''; clearInterval(timerIv); } return; }
  const can = canAct(pr, MY_UID), key = pr.id+':'+can;
  if(m.dataset.key===key) return;
  m.dataset.key = key; clearInterval(timerIv); paySel = null;
  const doAnim = !!pr.draw && !FAST && animId!==pr.id && !!$('#deck-'+pr.draw); if(doAnim) animId = pr.id;
  const act = cur(), waitTxt = pr.who==='others' ? 'Los demás equipos deciden si la respuesta fue buena.' : `Esperando a ${esc(act.name)}…`;
  m.className = 'modal on k-'+pr.kind;
  m.innerHTML = `<div class="card3d${doAnim?'':' done'}">${doAnim?`<div class="face back"><div class="backart"><b>INNOVAPOLY UQ</b><i>${LAB[pr.draw]}</i></div></div>`:''}<div class="face front"><div class="sheet" role="dialog" aria-modal="true"><div class="tag">${pr.tag}</div>${pr.title?`<h2>${pr.title}</h2>`:''}<div class="body">${pr.body}</div>
    ${pr.timer?`<div class="row"><span class="timer" id="tm">60</span><button class="btn" id="tmb" type="button">Iniciar cronómetro</button></div>`:''}
    ${can&&pr.field?`<input type="text" id="ask-field" placeholder="${esc(pr.field)}" maxlength="60" autocomplete="off">`:''}
    ${can?'<div class="btns"></div>':`<p class="wait">⏳ ${waitTxt}</p>`}</div></div></div>`;
  if(doAnim) runFlip(m, pr.draw);
  if(pr.timer){ $('#tmb').onclick = ()=>{ clearInterval(timerIv); let left=60; $('#tm').textContent=left; timerIv=setInterval(()=>{ left--; const t=$('#tm'); if(!t){clearInterval(timerIv);return;} t.textContent=Math.max(left,0); if(left<=0) clearInterval(timerIv); },1000); }; }
  let upd = ()=>{};
  if(pr.pay && can){
    const w = pr.pay.wallet, amount = pr.pay.amount, sel = {}; DENOMS.forEach(d=>sel[d]=0); paySel = sel;
    const box = document.createElement('div'); box.className = 'paybox';
    box.innerHTML = DENOMS.filter(d=>w[d]).map(d=>`<div class="brow"><span class="bill b${d/1000}"><span>${fmt(d)}</span><span>tienes ×${w[d]}</span></span><div class="step"><button type="button" data-d="${d}" data-s="-1" aria-label="Quitar un billete de ${fmt(d)}">−</button><b id="sel${d}">0</b><button type="button" data-d="${d}" data-s="1" aria-label="Agregar un billete de ${fmt(d)}">+</button></div></div>`).join('')
      + `<div class="paysum"><span>Seleccionado: <b id="psel">$0</b></span><span>Faltan: <b id="pmiss"></b></span><span>Cambio: <b id="pchg">$0</b></span></div>`;
    m.querySelector('.body').append(box);
    upd = ()=>{ const sum = DENOMS.reduce((s,d)=>s+d*sel[d],0); $('#psel').textContent = fmt(sum); $('#pmiss').textContent = fmt(Math.max(0,amount-sum)); $('#pchg').textContent = fmt(Math.max(0,sum-amount)); DENOMS.forEach(d=>{ const e=$('#sel'+d); if(e) e.textContent = sel[d]; }); const pb = m.querySelector('.btns button'); if(pb) pb.disabled = sum<amount; };
    box.onclick = e=>{ const b = e.target.closest('button[data-d]'); if(!b) return; const d = +b.dataset.d; sel[d] = Math.max(0, Math.min(w[d]||0, sel[d] + (+b.dataset.s))); upd(); };
  }
  if(can){
    const box = m.querySelector('.btns');
    pr.buttons.forEach(b=>{ const el=document.createElement('button'); el.className='btn '+(b.cls||''); el.innerHTML=b.label;
      el.onclick = ()=>{ const f=$('#ask-field'), t=f?f.value.trim():''; if(b.needText && !t){ f.focus(); return; }
        const sel = paySel ? Object.assign({}, paySel) : undefined;
        m.dataset.key = 'sent'; box.querySelectorAll('button').forEach(x=>x.disabled=true);
        if(role==='host') hostResp(MY_UID,{pid:pr.id, v:b.value, text:t, sel}); else toHost({t:'resp', pid:pr.id, v:b.value, text:t, sel}); };
      box.append(el); });
    upd();
    const f = $('#ask-field') || box.querySelector('button:not(:disabled)') || box.querySelector('button'); f && f.focus();
  }
}
function renderFinal(){
  const sc = scoreAll(), order = S.players.map((p,i)=>i).sort((a,b)=>sc[b].total-sc[a].total), top = sc[order[0]].total, win = order.filter(i=>sc[i].total===top);
  $('#app').innerHTML = `<section class="panel final"><div class="note">Resultados</div><div class="winner">${win.length>1?'Empate: ':'Gana '}${win.map(i=>esc(S.players[i].ficha+' '+S.players[i].name)).join(' y ')} con ${top} puntos</div>
    <div class="scroll"><table><thead><tr><th>Equipo</th><th>Llegada</th><th>Dinero</th><th>Tarjetas</th><th>Extras</th><th>Total</th></tr></thead><tbody>
    ${order.map(i=>{ const b=sc[i], p=S.players[i]; return `<tr><td>${esc(p.ficha)} ${esc(p.name)}</td><td>${b.llegada}</td><td>${b.dinero}<br><small class="note">${fmt(money(p))}</small></td><td>${b.tarjetas}</td><td>${b.extras}</td><td class="tot">${b.total}</td></tr>`; }).join('')}</tbody></table></div>
    <p class="note">Tarjetas: creación 5, protección 8, transferencia 10, desafío 5, interrogante 3, sanción -1. Extras: venta de una creación (+10) y ficha propia (+10).</p>
    <div class="row"><button class="btn primary" id="again" type="button">Volver al inicio</button></div></section>`;
  $('#again').onclick = ()=>{ stopNet(); ls.del('inv-room'); ls.del('inv-host'); S=null; role='none'; view='landing'; render(); };
}
function render(){
  renderTop();
  if(view==='landing') return renderLanding();
  if(view==='local') return renderLocal();
  if(view==='room') return renderRoom();
  if(!S) return;
  if(view==='final' || S.phase==='over'){ view='final'; $('#modal').className='modal'; $('#modal').dataset.key=''; return renderFinal(); }
  renderGame(); renderPrompt();
}
render();
window.__dbg = {get S(){return S}};
</script>

<div id="bgm" aria-label="Música de fondo">

      <input type="range" id="bgm-vol" min="0" max="100" value="40" aria-label="Volumen">

  </div>
  <button type="button" class="bgm-tab" id="bgm-tab" aria-expanded="false" aria-controls="bgm-panel" aria-label="Abrir música de fondo">🎵</button>
</div>
<script>
(function(){
  const VID = 'oJ8TZqeWmlo', box = document.getElementById('bgm'), tab = document.getElementById('bgm-tab'), msg = document.getElementById('bgm-msg');
  const playB = document.getElementById('bgm-play'), muteB = document.getElementById('bgm-mute'), vol = document.getElementById('bgm-vol');
  let yt = null, ready = false, loading = false, wantPlay = false;
  function setMsg(t){ msg.textContent = t; }
  function ui(){ if(!ready) return; const st = yt.getPlayerState(); playB.textContent = st===1 ? '⏸' : '▶'; muteB.textContent = yt.isMuted() ? '🔇' : '🔊'; }
  function load(){
    if(loading) return; loading = true; setMsg('Cargando reproductor…');
    const make = ()=>{ yt = new YT.Player('bgm-player', {width:200, height:200, videoId:VID, playerVars:{playsinline:1, rel:0, loop:1, playlist:VID, modestbranding:1},
      events:{ onReady(){ ready = true; yt.setVolume(+vol.value); setMsg('Listo. Toca ▶ para empezar.'); if(wantPlay) yt.playVideo(); ui(); },
               onStateChange(){ ui(); },
               onError(){ ready = false; setMsg('Este video no se puede reproducir aquí. Ábrelo en YouTube.'); } } }); };
    if(window.YT && YT.Player) return make();
    const prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = ()=>{ if(prev) try{ prev(); }catch(e){} make(); };
    const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; sc.onerror = ()=>{ loading = false; setMsg('No se pudo cargar YouTube. Revisa tu conexión.'); }; document.head.appendChild(sc);
  }
  tab.onclick = ()=>{ const o = box.classList.toggle('open'); tab.setAttribute('aria-expanded', o); tab.setAttribute('aria-label', o ? 'Cerrar música de fondo' : 'Abrir música de fondo'); if(o) load(); };
  playB.onclick = ()=>{ if(!ready){ wantPlay = true; load(); return; } yt.getPlayerState()===1 ? yt.pauseVideo() : yt.playVideo(); };
  muteB.onclick = ()=>{ if(!ready) return; yt.isMuted() ? yt.unMute() : yt.mute(); ui(); };
  vol.oninput = ()=>{ if(ready){ yt.setVolume(+vol.value); if(yt.isMuted() && +vol.value>0) yt.unMute(); ui(); } };
})();
</script>
